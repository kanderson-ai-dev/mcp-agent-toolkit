name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lockfile freshness
        run: uv lock --check

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy --strict src

      - name: Test (offline, deterministic)
        run: >
          uv run pytest -q --cov=src --cov-branch
          --cov-report=xml --cov-fail-under=92

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Requirements freshness
        run: |
          uv export --frozen --no-emit-project -o requirements.ci.txt
          diff requirements.txt requirements.ci.txt

      - name: Dependency audit
        # Audits the locked export: pip-audit cannot resolve the local
        # project itself (it is not published to PyPI).
        run: uv run pip-audit -r requirements.txt --strict

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the console
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium

      - name: E2E (offline, deterministic)
        run: uv run pytest tests/e2e -q

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mcp-agent-toolkit .

      - name: Boot the web adapter in the container
        run: |
          docker run -d --name app -p 8123:8123 \
            -e LLM_PROVIDER=stub -e SEARCH_PROVIDER=none \
            -e WEB_HOST=0.0.0.0 -e WEB_PORT=8123 \
            mcp-agent-toolkit python -m mcp_toolkit.web
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8123/api/health; then
              break
            fi
            [ "$i" = "45" ] && { docker logs app; exit 1; }
            sleep 1
          done

      - name: Assert the API answers
        run: |
          curl -fsS http://127.0.0.1:8123/api/status | grep -q '"toolCount":4'
          for tool in web_search db_query read_file write_file; do
            curl -fsS http://127.0.0.1:8123/api/tools | grep -q "\"$tool\""
          done

      - name: Assert the built console is served
        run: curl -fsS http://127.0.0.1:8123/ | grep -q '<div id="root">'

      - name: Assert the evaluation package ships
        run: |
          docker exec app test -f /app/evaluation/scorecard.json
          docker exec app test -f /app/evaluation/dataset.json

      - name: Assert the container runs as non-root
        run: docker exec app id -u | grep -q '^10001$'

      - name: Assert the prompt registry ships in the image
        run: docker exec app test -f /app/prompts/agent_system/v1.yaml
