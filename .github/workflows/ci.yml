name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      # frontend/ is its own package — the root lint ignores it, so its
      # lint+typecheck gates run explicitly here.
      - run: npm --prefix frontend ci

      - name: Lint
        run: npm run lint && npm --prefix frontend run lint

      - name: Typecheck (strict)
        run: npm run typecheck && npm --prefix frontend run typecheck

      - name: Tests + coverage (offline, no secrets)
        run: npm run test:cov
        env:
          SEARCH_PROVIDER: none
          LLM_PROVIDER: stub

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      - run: npm --prefix frontend ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed fixture DB
        run: npm run seed:db

      - name: Build backend + frontend
        run: npm run build && npm --prefix frontend run build

      # Deterministic console E2E — StubLLM + SEARCH_PROVIDER=none,
      # zero credentials. Videos upload as artifacts on failure.
      - name: Console E2E
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned binary + full-history scan: gitleaks-action's push-range
      # diff breaks on the branch's first push (root commit has no parent).
      - name: Scan for secrets (full git history)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact=100 --verbose .
