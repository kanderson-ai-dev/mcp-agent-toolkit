name: live-eval

# Manual + weekly only — never on pull_request: the job spends real
# OpenAI credit and its scorecard is uploaded as an artifact for a human
# to review and commit, never auto-committed.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Live evaluation scorecard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: uv run python -m evaluation.run_eval

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-live
          path: evaluation/scorecard.json
          if-no-files-found: error
