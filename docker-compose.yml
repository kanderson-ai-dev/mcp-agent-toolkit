# MCP servers speak stdio — the agent client spawns the server as a child
# process, so "server + client together" is one container running the agent
# CLI, which brings the MCP server up internally over stdin/stdout.
services:
  agent:
    build: .
    image: mcp-agent-toolkit
    env_file:
      # Optional: with no .env the agent runs on the deterministic StubLLM
      # and keyless/offline search — the demo still exercises 3 MCP tools.
      - path: .env
        required: false
    volumes:
      # Persist only the sandbox: reports the agent writes survive the run.
      - sandbox-data:/app/data/sandbox
    # Usage:
    #   docker compose up                # runs the default demo question once
    #   docker compose run --rm agent "your question here"
    #   docker compose run --rm agent --stub "offline run, no keys needed"

  web:
    build: .
    image: mcp-agent-toolkit
    # The image ENTRYPOINT is the agent CLI — override it entirely.
    entrypoint: ["node", "dist/web/index.js"]
    env_file:
      - path: .env
        required: false
    environment:
      WEB_PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - sandbox-data:/app/data/sandbox
    # Usage:
    #   docker compose up web            # web console on http://localhost:3000
    #   Local, single-user, unauthenticated — see SECURITY.md before
    #   exposing the port beyond your machine.

volumes:
  sandbox-data:
