# Offline demo topology: everything runs deterministic with zero secrets
# (StubLLM + SEARCH_PROVIDER=none). Set real keys to go live.
# Author: Kaarsten Anderson <contact@kaarstenanderson.com>

services:
  # Standalone MCP server over stdio. stdin stays open so the process
  # keeps serving; /metrics + /healthz are exposed on METRICS_PORT for
  # inspection (the MCP transport itself is stdio — nothing is published
  # on the network for it).
  server:
    build: .
    image: mcp-agent-toolkit:local
    command: ["python", "-m", "mcp_toolkit.server"]
    stdin_open: true
    environment:
      SEARCH_PROVIDER: none          # tavily | duckduckgo | auto to go live
      # SEARCH_API_KEY: ""           # Tavily key (optional, paid)
      SANDBOX_ROOT: /data/sandbox
      DB_PATH: /data/demo.db
      LOG_LEVEL: info
      METRICS_PORT: "9108"
      # RATE_LIMIT_PER_MINUTE: "60"
      # MAX_TOOL_OUTPUT_CHARS: "12000"
      # READ_FILE_MAX_BYTES: "262144"
      # WRITE_FILE_MAX_BYTES: "1048576"
    volumes:
      - toolkit-data:/data
    ports:
      - "127.0.0.1:9108:9108"        # /metrics + /healthz only
    restart: unless-stopped

  # One-shot client demo: spawns its own server over stdio inside the
  # container (exactly like the local CLI), asks a question through the
  # deterministic StubLLM, prints the event stream, and exits.
  #   docker compose run --rm client
  client:
    build: .
    image: mcp-agent-toolkit:local
    command: ["python", "-m", "scripts.demo"]
    environment:
      LLM_PROVIDER: stub             # openai + OPENAI_API_KEY for a live run
      # OPENAI_API_KEY: ""
      # CHAT_MODEL_NAME: gpt-4o-mini
      SEARCH_PROVIDER: none
      SANDBOX_ROOT: /data/sandbox
      DB_PATH: /data/demo.db
      LOG_LEVEL: info
      OUTPUT_FORMAT: pretty          # json for a machine-readable stream
      # MAX_TOOL_ITERATIONS: "8"
    volumes:
      - toolkit-data:/data

  # Web console: FastAPI + SSE API serving the built React app on one
  # port. WEB_HOST=0.0.0.0 makes it reachable inside the container; the
  # published port stays loopback-only on the host. The lifespan seeds
  # the fixture DB into the shared volume on first run.
  #   docker compose up web   →  http://127.0.0.1:3000
  web:
    build: .
    image: mcp-agent-toolkit:local
    command: ["python", "-m", "mcp_toolkit.web"]
    environment:
      LLM_PROVIDER: stub             # openai + OPENAI_API_KEY for a live run
      # OPENAI_API_KEY: ""
      SEARCH_PROVIDER: none
      SANDBOX_ROOT: /data/sandbox
      DB_PATH: /data/demo.db
      LOG_LEVEL: info
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
      # ENABLE_PROMPT_ADMIN: "1"     # prompt mutations — unauthenticated!
    volumes:
      - toolkit-data:/data
    ports:
      - "127.0.0.1:3000:3000"        # API + console; loopback-only
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/api/health',timeout=2).status==200 else 1)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  toolkit-data:
