[project]
name = "mcp-toolkit"
version = "0.1.0"
description = "MCP server + agent client + web console: guarded tools over an open protocol, with measured quality."
readme = "README.md"
authors = [
    { name = "Kaarsten Anderson", email = "kaarsten.anderson@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.128",
    "httpx>=0.28.1",
    "langsmith>=0.14.12",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "openai>=3.36.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.40",
]

[project.scripts]
mcp-toolkit-server = "mcp_toolkit.server.__main__:main"
mcp-toolkit-agent = "mcp_toolkit.client.cli:main"
mcp-toolkit-web = "mcp_toolkit.web.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pip-audit>=2.10.0",
    "playwright==1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "types-lxml>=2026.2.16",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S603", "S607"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
packages = ["mcp_toolkit", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires real credentials/network — opt-in via RUN_LIVE_TESTS=1",
    "e2e: Playwright browser end-to-end tests",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 92
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
